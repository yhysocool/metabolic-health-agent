name: metabolic-health-agent-demo

services:
  api:
    build:
      context: .
    environment:
      MHA_ENVIRONMENT: development
      MHA_REPOSITORY_BACKEND: memory
      MHA_SEED_SYNTHETIC_DATA: "true"
      MHA_LLM_PROVIDER: qwen
      MHA_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8000
        SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
